<!-- Hidden input: capture="environment" opens the rear camera on mobile and
     is simply ignored on desktop, where it falls back to a file picker. -->
<input
  #fileInput
  type="file"
  accept="image/*"
  capture="environment"
  (change)="onFileSelected($event)"
  style="display:none;" />

<!-- Trigger button — sits next to the voice button, same look & feel -->
@if (!previewUrl()) {
  <button
    type="button"
    (click)="fileInput.click()"
    style="display:flex; align-items:center; justify-content:center; gap:8px;
           width:100%; padding:12px; background:#0d9488; color:white; border:none;
           border-radius:6px; font-size:14px; font-weight:500; cursor:pointer;">
    <span style="font-size:18px;">🧾</span>
    Scan receipt
  </button>
}

<!-- Image preview + processing controls -->
@if (previewUrl(); as url) {
  <div style="border:1px solid #ccfbf1; background:#f0fdfa; border-radius:8px;
              padding:12px;">

    <img
      [src]="url"
      alt="Receipt preview"
      style="display:block; width:100%; max-height:260px; object-fit:contain;
             border-radius:6px; background:#fff;" />

    <!-- Loading state while OCR runs -->
    @if (isScanning()) {
      <div style="margin-top:12px;">
        <p style="font-size:13px; color:#0f766e; margin:0 0 8px;">
          Reading receipt… {{ progressPercent() }}%
        </p>
        <div style="height:6px; background:#ccfbf1; border-radius:3px; overflow:hidden;">
          <div
            [style.width.%]="progress() * 100"
            style="height:100%; background:#0d9488; transition:width 0.2s;"></div>
        </div>
      </div>
    } @else {
      <!-- Ready to process, or to swap the photo -->
      <div style="display:flex; gap:10px; margin-top:12px;">
        <button
          type="button"
          (click)="readReceipt()"
          style="flex:1; padding:10px; background:#0d9488; color:white; border:none;
                 border-radius:6px; font-size:14px; font-weight:500; cursor:pointer;">
          Read receipt
        </button>
        <button
          type="button"
          (click)="fileInput.click()"
          style="padding:10px 14px; background:white; color:#0f766e;
                 border:1px solid #99f6e4; border-radius:6px; font-size:14px;
                 cursor:pointer;">
          Retake
        </button>
        <button
          type="button"
          (click)="clear()"
          style="padding:10px 14px; background:white; color:#374151;
                 border:1px solid #ddd; border-radius:6px; font-size:14px;
                 cursor:pointer;">
          Cancel
        </button>
      </div>
    }

    <!-- OCR error (user-friendly, from the service) -->
    @if (ocrError()) {
      <p style="font-size:13px; color:#c53030; margin:12px 0 0;">
        ⚠️ {{ ocrError() }}
      </p>
    }
  </div>
}
